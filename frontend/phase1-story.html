function render(){const l=lessons[current];state='choice';selection.clear();$('replay').hidden=true;if(l===hands){video.hidden=true;$('scene').src=assets.wash}$('count').textContent=(current+1)+' / '+lessons.length;document.querySelector('nav').innerHTML=lessons.map((_,i)=>'<i class="'+(i<=current?'on':'')+'"></i>').join('');document.querySelector('h1').textContent=l.title;$('prompt').textContent=l.prompt;$('cards').replaceChildren();l.choices.forEach((name,i)=>{const b=document.createElement('button');b.className='card';b.setAttribute('aria-pressed','false');if(l.choices===cloths){const img=new Image();img.src=assets[name];img.alt='';b.append(img)}else{b.classList.add('place');const symbol=document.createElement('b');symbol.textContent=(l===glass?['▯','☕','⌑']:l===hygiene?['①','②','③']:['◌','▤','♨'])[i];b.append(symbol)}b.append(name);b.onclick=()=>{if(state!=='choice')return;if(selection.has(i))selection.delete(i);else{if(l.keys.length===1)selection.clear();selection.add(i)}update()};$('cards').append(b)});update()}
function update(){const multi=lessons[current].keys.length>1;[...$('cards').children].forEach((b,i)=>b.setAttribute('aria-pressed',selection.has(i)));$('feedback').textContent=multi?'备品盘　'+selection.size+' / 2 件':' ';$('action').textContent=multi?'检查备品盘':'确认选择';$('action').disabled=multi?selection.size!==2:!selection.size}

const panel=document.querySelector('section'), title=document.querySelector('h1'), cues=[19,41,77,89,116];
let next=0,timer;
function message(text){clearTimeout(timer);$('toast').textContent=text;$('toast').hidden=false;timer=setTimeout(()=>$('toast').hidden=true,2600)}
function playFilm(){state='film';video.hidden=false;panel.hidden=true;$('return').hidden=false;$('return').textContent='暂停';video.play().catch(()=>{$('return').textContent='继续播放'})}
function pauseForChoice(){video.pause();$('toast').hidden=true;$('return').hidden=true;panel.hidden=false;$('cards').hidden=false;current=next;render()}
video.ontimeupdate=()=>{if(state==='film' && next<cues.length && video.currentTime>=cues[next])pauseForChoice()};
video.onended=()=>{if(state==='film')pauseForChoice()};
$('return').onclick=()=>{if(video.paused)playFilm();else{video.pause();$('return').textContent='继续播放'}};
function start(){next=0;current=0;video.currentTime=0;$('count').textContent='第一视角跟练';document.querySelector('nav').innerHTML='';playFilm()}
$('action').onclick=()=>{
 if(state==='intro'||state==='done'){start();return}
 const l=lessons[current];
 if(!l.keys.every(k=>selection.has(k))){const wrong=[...selection].find(k=>!l.keys.includes(k));$('feedback').textContent=l.hints[wrong]+' 可以改选。';return}
 if(l===kit){state='done';title.textContent='准备工作已完成';$('cards').hidden=true;$('prompt').textContent='下一阶段：冰杯预处理';$('feedback').textContent=l.success;$('action').textContent='从头再练';return}
 next++;playFilm();message(l.success)
};
video.onerror=()=>{panel.hidden=false;$('feedback').textContent='视频未能加载，请确认手机仍连着同一 Wi-Fi，刷新后重试。'};
state='intro';$('scene').src='assets/phase1-start.jpg';title.textContent='跟老师准备工作台';$('count').textContent='PHASE 1';$('prompt').textContent='从走进吧台开始，跟老师取杯、洗手、准备器具。轮到你决定时，点选画面里的卡片。';$('feedback').textContent='约 2 分钟 · 到你操作时，画面会自动暂停。';$('cards').hidden=true;$('action').textContent='开始跟练';
</script></html>
