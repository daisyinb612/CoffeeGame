<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>五张场景图的修改要求 · CoffeeGame</title>
  <link rel="stylesheet" href="scene-prompts.css?v=2">
  <script type="module" src="scene-prompts.js?v=2"></script>
</head>
<body>
  <main class="page">
    <header>
      <a href="scene-box-game.html">← 返回可旋转场景</a>
      <span class="eyebrow">COFFEEGAME / 图片修改要求</span>
      <h1>五张图，逐张写你的要求</h1>
      <p>按你保存的 Prompt 整理了五张预览图。每项都能对照原图与新预览，点击图片可看大图；如果要调整，直接改下面的 Prompt 并保存。当前游戏场景尚未切换到这些预览图。</p>
    </header>
    <form id="prompt-form">
      <div id="image-list" class="image-list"></div>
      <div class="actions"><button id="save" type="submit">保存五条 Prompt</button><span id="status" role="status" aria-live="polite">还没有修改图片。</span></div>
    </form>
  </main>
