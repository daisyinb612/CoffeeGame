<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <title>冰美式制作 · CoffeeGame</title>
  <link rel="stylesheet" href="drama.css?v=welcome-guide-1">
  <link rel="stylesheet" href="cleanup-discovery.css?v=discovery-toolbar-2">
  <link rel="stylesheet" href="return-tools.css?v=return-locations-5">
  <link rel="stylesheet" href="cloth-matching.css?v=cloth-clear-2">
  <link rel="stylesheet" href="service-speech.css?v=recording-click-fix-1">
  <link rel="stylesheet" href="service-tray.css?v=physical-serving-1">
  <script type="module" src="drama.js?v=welcome-guide-1"></script>
</head>
<body>
  <main class="stage" id="stage" data-mode="dialogue" aria-label="冰美式制作互动教学">
    <video id="film" src="media/story-original.mp4?v=971ed4cb" poster="media/story-full.jpg?v=full-resolution" playsinline muted preload="metadata" aria-label="完整第一人称实拍">
      <track id="caption-track" kind="captions" srclang="zh-CN" label="简体中文" src="captions/story-zh.vtt?v=full-caption-sync">
    </video>
    <section id="loading" class="loading-screen" aria-labelledby="overview-title">
      <div class="loading-panel">
        <header class="overview-header">
          <h2 id="overview-title">冰美式制作</h2>
          <p>视频约 10 分钟 · <span>跟练建议预留 20–30 分钟</span></p>
        </header>
        <div id="loading-status">
          <div class="loading-heading">
            <p id="loading-title" role="status">正在打开课程</p>
            <span id="loading-percent" aria-hidden="true"></span>
          </div>
          <progress id="loading-bar" max="100" aria-labelledby="loading-title"></progress>
          <p id="loading-detail">正在准备播放器…</p>
        </div>
        <div id="overview-welcome" hidden>
          <div class="welcome-guide">
            <h3>操作说明</h3>
            <p><strong>切换关卡</strong>　点右上角齿轮「设置」，选「关卡选择」，再点想练的关卡。</p>
            <p><strong>跟着视频练</strong>　点「开始学习」。播放时可以暂停或开关原声，遇到练习会自动暂停。</p>
          </div>
          <button id="overview-start" type="button">开始学习</button>
        </div>
        <div class="overview-card">
          <h3>关卡总览 <span id="overview-count"></span></h3>
          <ol id="overview-phases">
            <li data-phase="0"><span>准备及个人卫生</span></li>
            <li data-phase="1"><span>冰杯预处理</span></li>
            <li data-phase="2"><span>手柄处理</span></li>
            <li data-phase="6"><span>咖啡机萃取操作</span></li>
            <li data-phase="3"><span>调配与搅拌操作</span></li>
            <li data-phase="4"><span>成品与摆盘出品</span></li>
            <li data-phase="5"><span>清洁与工作台复位</span></li>
          </ol>
        </div>
      </div>
    </section>
    <div id="captions" class="captions" hidden><span></span></div>
    <div class="controls" role="group" aria-label="短剧控制">
      <button id="pause" type="button" hidden>暂停</button>
      <button id="sound" type="button" aria-pressed="false" hidden>原声 · 关</button>
      <button id="settings-button" type="button" aria-label="设置" aria-haspopup="dialog" aria-controls="settings">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 2h4l.7 3 1.7.9 2.9-.9 2 3.5-2.1 2.1v2.8l2.1 2.1-2 3.5-2.9-.9-1.7.9-.7 3h-4l-.7-3-1.7-.9-2.9.9-2-3.5 2.1-2.1v-2.8L2.7 8.5l2-3.5 2.9.9 1.7-.9z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
    <div class="scene-overlay" aria-labelledby="scene-title">
      <div class="scene-sheet">
        <div class="scene-copy">
          <h1 id="scene-title" class="visually-hidden" tabindex="-1">冰美式制作</h1>
          <p id="speaker"></p>
          <p id="line" role="status" tabindex="-1"></p>
          <p id="feedback" role="status"></p>
        </div>
        <div id="actions"></div>
      </div>
    </div>
    <dialog id="settings" aria-labelledby="settings-title">
      <div class="settings-header">
        <h2 id="settings-title" tabindex="-1">设置</h2>
        <button id="close-settings" type="button" aria-label="关闭设置">关闭</button>
      </div>
      <div id="settings-menu">
        <button id="choose-level" type="button">关卡选择 <span aria-hidden="true">›</span></button>
      </div>
      <div id="settings-levels" hidden>
        <div id="level-list" class="level-list"></div>
        <button id="back-to-settings" type="button">返回设置</button>
      </div>
    </dialog>
  </main>
</body>
</html>
