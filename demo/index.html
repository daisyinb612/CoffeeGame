<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <title>冰美式制作 · CoffeeGame</title>
  <link rel="stylesheet" href="drama.css?v=inventory">
  <script type="module" src="drama.js?v=inventory"></script>
</head>
<body>
  <main class="stage" id="stage" data-mode="dialogue" aria-label="冰美式制作互动教学">
    <video id="film" src="media/story-original.mp4" poster="media/story-full.jpg?v=lesson-start" playsinline muted preload="metadata" aria-label="完整第一人称实拍">
      <track id="caption-track" kind="captions" srclang="zh-CN" label="简体中文" src="captions/story-zh.vtt?v=opening2">
    </video>
    <div id="captions" class="captions" hidden><span></span></div>
    <div id="controls" class="controls" aria-label="播放控制" hidden>
      <button id="pause" type="button">暂停</button>
      <button id="sound" type="button" aria-pressed="false">原声 · 关</button>
    </div>
    <div class="scene-overlay" aria-labelledby="scene-title">
      <div class="scene-sheet">
        <div class="scene-copy">
          <h1 id="scene-title" class="visually-hidden" tabindex="-1">冰美式制作</h1>
          <p id="speaker"></p>
          <p id="line" role="status"></p>
          <p id="feedback" role="status"></p>
        </div>
        <div id="actions"></div>
      </div>
    </div>
  </main>
</body>
</html>
