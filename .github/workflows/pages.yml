name: Deploy coffee lesson

on:
  push:
    branches: [showdemo]
  workflow_dispatch:

concurrency:
  group: coffee-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the static lesson
        env:
          LESSON_VIDEO_URL: https://innojudge.ecnu.edu.cn/skill/public/18979/v/BQhqHSRvs56OfkVcbY5Nzrj1y6jxvr_H.mp4
        run: |
          set -euo pipefail
          git lfs pull --include='demo/media/*.mp4' --exclude=''
          mkdir -p _site
          rsync -a --exclude='*.py' --exclude='*.md' demo/ _site/
          python3 - <<'PY'
          import os
          from pathlib import Path
          from html import escape
          from urllib.parse import urlsplit

          page = Path('_site/index.html')
          html = page.read_text()
          source = 'src="media/story-original.mp4?v=971ed4cb"'
          assert html.count(source) == 1, 'Expected one local lesson video source'
          url = escape(os.environ['LESSON_VIDEO_URL'], quote=True)
          origin = escape(urlsplit(os.environ['LESSON_VIDEO_URL']).netloc, quote=True)
          html = html.replace('<head>', f'<head>\n  <link rel="preconnect" href="https://{origin}">')
          page.write_text(html.replace(source, f'src="{url}"'))
          PY
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v5
